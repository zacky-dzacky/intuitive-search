apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-dashboard
  namespace: default
  labels:
    app: admin-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-dashboard
  template:
    metadata:
      labels:
        app: admin-dashboard
    spec:
      containers:
        - name: admin
          image: host.docker.internal:5000/admin-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: BACKEND_BASE_URL
              value: "http://intuitive-search-svc:8080"
          envFrom:
            - secretRef:
                name: admin-dashboard-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
