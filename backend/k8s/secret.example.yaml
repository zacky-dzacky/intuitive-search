# Copy to secret.yaml (git-ignored) and fill in real values before `kubectl apply`.
apiVersion: v1
kind: Secret
metadata:
  name: intuitive-search-secret
  namespace: default
type: Opaque
stringData:
  DATABASE_URL: "jdbc:postgresql://host.docker.internal:5432/banksearch"
  DATABASE_USER: "bank"
  DATABASE_PASSWORD: "bank"
  # Azure AI Foundry key (via the LiteLLM proxy) for Stage-2 chat. Also used
  # for embeddings unless OPENAI_EMBEDDING_API_KEY is set as well.
  OPENAI_API_KEY: "sk-..."
  # The Foundry key has no embedding model yet, so embeddings still go to
  # Gemini with its own key. Remove (and the OPENAI_EMBEDDING_* configmap
  # entries) once the Foundry key covers an embedding deployment.
  OPENAI_EMBEDDING_API_KEY: "your-gemini-key-here"
  # Uncomment if LLM_PROVIDER=anthropic
  # ANTHROPIC_API_KEY: "your-key-here"
