# Copy to secret.yaml (git-ignored) and fill in real values before `kubectl apply`.
apiVersion: v1
kind: Secret
metadata:
  name: intuitive-search-secret
  namespace: default
type: Opaque
stringData:
  DATABASE_URL: "jdbc:postgresql://host.docker.internal:5432/banksearch"
  DATABASE_USER: "bank"
  DATABASE_PASSWORD: "bank"
  # The API key for the OpenAI-compatible provider (Gemini now, Azure AI
  # Foundry later). One key serves both chat and embeddings unless
  # OPENAI_EMBEDDING_API_KEY is set as well.
  OPENAI_API_KEY: "your-key-here"
  # Uncomment if LLM_PROVIDER=anthropic
  # ANTHROPIC_API_KEY: "your-key-here"
