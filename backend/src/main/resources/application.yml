spring:
  application:
    name: intuitive-search

  # The pipeline chains several blocking I/O calls per request (embedding
  # service -> Postgres -> LLM -> Postgres). Virtual threads let that scale
  # on plain blocking code instead of reactive plumbing.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/banksearch}
    username: ${DATABASE_USER:bank}
    password: ${DATABASE_PASSWORD:bank}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 2000
      pool-name: search-pool

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.bank.intuitivesearch: INFO

search:
  # ---- Stage 1: hybrid retrieval -----------------------------------
  candidate-limit: 10
  # Relative weights for the retrieval channels. If a channel is unavailable
  # (e.g. the embedding provider is down) its weight is dropped and the
  # remaining ones are renormalised, so confidence stays comparable.
  # The first three run against the in-process Lucene index (see
  # index/FeatureIndex.java); the registry itself lives in Postgres.
  #   keyword     - BM25 over stemmed text, with prefix matching for typeahead
  #   trigram     - trigram similarity for typos and abbreviations
  #   vector      - cosine similarity over HNSW
  #   containment - the query literally contains one of the feature's naming
  #                 terms. Carries the most weight of the lexical channels
  #                 because it is the only one that stays reliable when a
  #                 command query is padded with parameter text.
  weights:
    keyword: 0.20
    trigram: 0.15
    vector: 0.35
    containment: 0.30
  # Below this, we return suggestions instead of committing to a feature.
  navigate-threshold: 0.35
  # Stage 2 is gated on a positive signal score AND feature certainty.
  # Certainty is satisfied by either a high absolute score, or a clear margin
  # over the runner-up — parameter text dilutes every similarity channel, so
  # absolute score alone would gate out exactly the queries Stage 2 exists for.
  extraction-threshold: 0.62
  extraction-margin: 0.15
  # An exact hit on a display name or alias ("trf") is not ambiguous.
  exact-match-confidence: 0.97

  # ---- Signal detection (generic, feature-agnostic) ----------------
  signal:
    # Fire Stage 2 when the weighted signal score reaches this.
    threshold: 2
    weight-number: 2
    weight-currency: 1
    # A concrete date word is as strong an indicator of extractable content as
    # a number ("...for march" names a statement period outright).
    weight-date: 2
    weight-extra-token: 1
    # A residue token is only weak evidence when the feature's slots all want a
    # number, a date or a currency — those score on their own. When a slot can
    # hold a bare word (a payee, an account nickname, a biller), that word is
    # the whole parameter, and word count is not a measure of intent.
    weight-extra-token-free-text: 2
    max-extra-token-score: 2
    currency-codes: >-
      usd,eur,gbp,jpy,sgd,aud,cad,chf,cny,hkd,idr,myr,thb,php,vnd,inr,krw,nzd,sek,aed,sar
    currency-symbols: "$,€,£,¥,₹,₩,₫,฿,₱,rp,rm,s$,a$,hk$"
    date-words: >-
      today,tomorrow,yesterday,tonight,now,later,week,weekly,month,monthly,year,yearly,
      daily,quarter,annual,january,february,march,april,may,june,july,august,september,
      october,november,december,jan,feb,mar,apr,jun,jul,aug,sep,sept,oct,nov,dec,monday,
      tuesday,wednesday,thursday,friday,saturday,sunday,mon,tue,wed,thu,fri,sat,sun,
      last,next,previous,past,upcoming,since,until,between,from,before,after
    stop-words: >-
      a,an,the,to,for,of,and,or,my,me,mine,i,is,are,am,do,does,please,want,need,would,
      like,can,could,should,let,us,get,go,show,open,with,on,at,in,it,this,that,there,
      here,new,some,any,all,s,pls,plz

  # ---- Stage 2: LLM slot extraction --------------------------------
  llm:
    # heuristic | openai | ollama | anthropic
    # `heuristic` needs no model at all and keeps the pipeline runnable in
    # dev/CI. `openai` is the office standard: any provider speaking the
    # OpenAI wire format with an API key — the Azure AI Foundry sandbox
    # (behind the bank's LiteLLM proxy) today, Gemini before it. Switching
    # between them is the three OPENAI_* values below and nothing else.
    provider: ${LLM_PROVIDER:heuristic}
    # Read timeout for the extraction call. Foundry via the proxy measured
    # ~1.3s per call; Gemini free tier was 0.9s–11s for the *same* request.
    # Raise per environment rather than in code; a timeout still degrades to
    # navigate, never fails.
    timeout-ms: ${LLM_TIMEOUT_MS:2500}
    max-output-tokens: 512
    openai:
      # Foundry (LiteLLM proxy): https://mbb-litellm-proxy-sb-sea.southeastasia.cloudapp.azure.com/v1
      # Gemini:                  https://generativelanguage.googleapis.com/v1beta/openai
      base-url: ${OPENAI_BASE_URL:}
      api-key: ${OPENAI_API_KEY:}
      # Foundry: gpt-5.4-mini or model-router (what the sandbox key is scoped
      # to). Gemini: a model name (gemini-3.6-flash).
      model: ${OPENAI_CHAT_MODEL:gpt-5.4-mini}
      # bearer (OpenAI, Gemini, Foundry / LiteLLM) | api-key (legacy Azure gateways)
      auth-header: ${OPENAI_AUTH_HEADER:bearer}
      # For thinking models only (gpt-5.x, Gemini 3.x, o-series): none | low |
      # medium | high. Extraction needs none of it; `low` took Gemini 3.6
      # Flash from ~3.9s to ~1.6s with the same output. Leave empty for a
      # non-reasoning deployment — the field is then not sent at all.
      reasoning-effort: ${OPENAI_REASONING_EFFORT:}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:3b-instruct}
    anthropic:
      # The spec names Haiku for this stage: small, fast, strict JSON.
      model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
      # API key resolves from ANTHROPIC_API_KEY or an `ant auth login` profile.

  # ---- Embedding provider ------------------------------------------
  # Same contract as Stage 2: any OpenAI-compatible /embeddings endpoint with
  # an API key. The Foundry sandbox key is chat-only (the proxy answers 403
  # on /embeddings), so this stays on Gemini with its own endpoint and key
  # until an embedding deployment is added to the key. With no endpoint or
  # key the vector channel is simply dropped and search runs lexical-only;
  # that is the dev/CI mode, there is no self-hosted model.
  embedding:
    enabled: ${EMBEDDING_ENABLED:true}
    openai:
      # Default to the chat provider's endpoint and key; override when the
      # embedding model is served from somewhere else (Gemini while Foundry
      # is chat-only).
      base-url: ${OPENAI_EMBEDDING_BASE_URL:${OPENAI_BASE_URL:}}
      api-key: ${OPENAI_EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
      # Gemini: gemini-embedding-001. Foundry: e.g. text-embedding-3-small deployment.
      model: ${OPENAI_EMBEDDING_MODEL:gemini-embedding-001}
      auth-header: ${OPENAI_AUTH_HEADER:bearer}
    # Vector size. Sent to the provider as `dimensions` and enforced on the
    # way back (a longer answer is truncated and re-normalised — the models
    # we target are Matryoshka-trained, so that is what the provider would
    # do server-side). Lucene's stock codec caps this at 1024, and 768 is
    # the sweet spot every target model documents.
    dimensions: ${EMBEDDING_DIMENSIONS:768}
    # End-to-end deadline for the whole operation, including time queued
    # waiting for an HTTP connection. A plain read timeout does not cover
    # that, and under load that is where the time actually goes. A hosted
    # provider round trip is ~150–400ms; typeahead repeats are served from
    # the query cache and never wait on it.
    timeout-ms: ${EMBEDDING_TIMEOUT_MS:800}
    # The catalogue is embedded in one batch at index build; not on the
    # request path, so it can afford to wait.
    document-timeout-ms: 30000
    # Recent query vectors kept in-process. With a hosted model each miss
    # is latency and money, and typeahead sends the same prefixes constantly.
    query-cache-size: 4096
    # Text prepended before embedding. The target models want none; kept
    # for instruction-tuned models that document a query-side hint.
    query-prefix: ""
    document-prefix: ""
    # Bulkhead. Past this many in-flight embedding calls, the vector channel
    # is skipped immediately rather than queued for.
    max-concurrent: 16
    # Circuit breaker: stop paying the deadline on every request once the
    # service is clearly unhealthy.
    circuit-breaker-failures: 5
    circuit-open-ms: 5000

  # ---- Stage 3: entity resolution ----------------------------------
  resolution:
    # pg_trgm similarity floor for accepting a fuzzy name match.
    min-similarity: 0.30
    # Below this gap between best and runner-up, we return both and let the
    # user pick on the pre-filled form.
    ambiguity-margin: 0.12
    max-candidates: 5
