# Grafana Alloy — log collector feeding the Loki addon.
#
# Loki (istio-1.22.0/samples/addons/loki.yaml) ships storage and a query API but
# no agent, so nothing lands in it until something pushes. Alloy is that agent.
# Grafana's Loki datasource is already provisioned by the Istio addon
# (configmap/grafana -> datasources.yaml -> http://loki:3100), so there is
# nothing to change on the Grafana side.
#
# Logs are tailed through the Kubernetes API rather than from node files. That
# avoids depending on the kubelet's on-disk log layout, which differs between
# runtimes, and needs no hostPath mount or root user.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: istio-system
  labels:
    app: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
  labels:
    app: alloy
rules:
  # Pod discovery, plus the node/namespace metadata used to build stream labels.
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  # The log stream itself.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
  labels:
    app: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: istio-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: istio-system
  labels:
    app: alloy
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // Kubernetes metadata arrives as __meta_* labels, which are discarded before
    // ingestion. Promote only the few worth indexing — every distinct label
    // combination is a separate Loki stream, so this list stays short.
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      // Every app pod here runs an Istio sidecar, so a pod emits two streams.
      // This label is what separates `backend` from `istio-proxy`.
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.istio-system.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: istio-system
  labels:
    app: alloy
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
      annotations:
        # Alloy is infrastructure, not a mesh workload. A sidecar here would only
        # add a hop between the collector and Loki.
        sidecar.istio.io/inject: "false"
        # Roll pods when the pipeline changes; Alloy does not watch the file.
        checksum/config: "v1"
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.19.2
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - name: http
              containerPort: 12345
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: storage
              mountPath: /tmp/alloy
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 10
            periodSeconds: 10
      tolerations:
        - effect: NoSchedule
          operator: Exists
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: storage
          emptyDir: {}
